services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patrimonio_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - sqlite_data:/app/data
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patrimonio_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - app_network

volumes:
  sqlite_data:

networks:
  app_network:
    driver: bridge
